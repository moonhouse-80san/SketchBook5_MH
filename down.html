<style>

#downloadWrapper .dcnt { position:absolute; left:131px; top:25px; padding:1px 9px; background:rgba(0,0,0,.8); border-radius:10px; color:#ffd400; font-size:11px; line-height:16px; white-space:nowrap; pointer-events:none; }
#downloadWrapper .dcnt b { color:#fff; }
</style>

<div id="downloadWrapper">
	<a href="#toggleExtraVars" class="downimg"></a>
	<span class="dcnt"><b class="dcnum">0</b>회</span>

	<div cond="$val->name==$mi->et_logon_name" id="toggleExtraVars" style="background-color:#747474"><i class="fas fa-download"></i>
	{$val->getValueHTML()}<b class="et"><span cond="$mi->et_logon_t">: {$mi->et_logon_t}</span><span cond="!$mi->et_logon_t">: 클릭하면 자료가 다운로드 됩니다.</span></b>
	</div>

	<div cond="$val->name==$mi->t_logon_name" id="toggleExtraVars" class="sty" onclick="<!--@if($mi->down_loca == '')-->location.href='{$val->getValueHTML()}'<!--@else-->location.href='{$val->getValueHTML()}'<!--@end-->"><i class="fas fa-download"></i>
	<b class="et"><span cond="$mi->et_logon_t">: {$mi->et_logon_t}</span><span cond="!$mi->et_logon_t">: 클릭하면 자료가 다운로드 됩니다.</span></b>
	</div>

	<div cond="$val->name==$mi->git_logon_name" id="toggleExtraVars" class="sty" onclick="<!--@if($mi->down_loca == '')-->location.href='{$val->getValueHTML()}?raw=true'<!--@else-->location.href='{$val->getValueHTML()}?raw=true'<!--@end-->"><i class="fas fa-download"></i>
	<b class="et"><span cond="$mi->et_logon_t">: {$mi->et_logon_t}</span><span cond="!$mi->et_logon_t">: 클릭하면 자료가 다운로드 됩니다.</span></b>
	</div>

	<div cond="$val->name==$mi->g_logon_name" id="toggleExtraVars" class="sty" onclick="<!--@if($mi->down_loca == '')-->location.href='https://docs.google.com/uc?export=download&id={$val->getValueHTML()}'<!--@else-->window.open('https://docs.google.com/uc?export=download&id={$val->getValueHTML()}')<!--@end-->"><i class="fas fa-download"></i>
	<b class="et"><span cond="$mi->et_logon_t">: {$mi->et_logon_t}</span><span cond="!$mi->et_logon_t">: 클릭하면 자료가 다운로드 됩니다.</span></b>
	</div>

	<div cond="$val->name==$mi->d_logon_name" id="toggleExtraVars" class="sty" onclick="<!--@if($mi->down_loca == '')-->location.href='https://www.dropbox.com/s/{$val->getValueHTML()}?dl=1'<!--@else-->window.open('https://www.dropbox.com/s/{$val->getValueHTML()}?dl=1')<!--@end-->"><i class="fas fa-download"></i>
	<b class="et"><span cond="$mi->et_logon_t">: {$mi->et_logon_t}</span><span cond="!$mi->et_logon_t">: 클릭하면 자료가 다운로드 됩니다.</span></b>
	</div>
</div>

<script>
	jQuery(function($){ 
		var dcUrl = '{Context::getRequestUri()}{substr($tpl_path, 2)}down_count.php';
		var dcSrl = '{$oDocument->document_srl}';
		$.getJSON(dcUrl, { srl: dcSrl }, function(res){
			$('#downloadWrapper .dcnum').text(res.count);
		});
		$('#downloadWrapper').on('click', function(e){
			if (!$(e.target).closest('#downloadWrapper > div').length) return;
			var token = window.getCSRFToken ? window.getCSRFToken() : '';
			fetch(dcUrl, {
				method: 'POST',
				keepalive: true,
				credentials: 'same-origin',
				headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-CSRF-Token': token },
				body: 'srl=' + encodeURIComponent(dcSrl)
			}).then(function(r){ return r.json(); }).then(function(res){
				$('#downloadWrapper .dcnum').text(res.count);
			}).catch(function(){});
		});
		$('#toggleExtraVars').hide();
		$('#downloadWrapper').hover(
			function(){
				if ($('#toggleExtraVars').is(":hidden")) {
					$('#toggleExtraVars').stop(true, true).slideDown("slow");
				} else {
					$('#toggleExtraVars').addClass('show'); 
				}
			},
			function(){
				$('#toggleExtraVars').stop(true, true).slideUp("slow", function() {
					$(this).removeClass('show'); 
				});
			}
		);
	});
</script>
